<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساحب أزورا - سحب الأرشيف بالخلفية (25 عامل) ⚡</title>
  <style>
    :root { --main: #ff9800; --bg: #0b0b0e; --card: #16161a; --border: #26262e; --ok:#4caf50; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #fff; padding: 15px; margin: 0; }
    .container { background: var(--card); padding: 20px; border-radius: 18px; max-width: 650px; margin: auto; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
    h2 { color: var(--main); text-align: center; margin: 0 0 10px; font-size: 22px; }
    .status-badge { display: block; text-align: center; padding: 8px 15px; border-radius: 12px; font-size: 13px; font-weight: bold; background: #1f1a0e; color: var(--main); border: 1px solid var(--main); margin-bottom: 15px; }
    .grid-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .stat-card { background: #0e0e11; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
    .stat-card h3 { margin: 0; color: var(--main); font-size: 20px; }
    .stat-card p { margin: 3px 0 0; font-size: 11px; color: #888; }
    #logBox { font-size: 12px; color: #64b5f6; white-space: pre-line; text-align: right; background: #060608; padding: 12px; border-radius: 10px; height: 380px; overflow-y: auto; border: 1px solid var(--border); font-family: monospace; line-height: 1.6; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: var(--main); color: #000; font-size: 15px; }
    .btn.stop { background: #e53935; color: #fff; }
    .btn.fix { background: var(--ok); color: #000; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    <h2>ساحب أزورا (الخلفية + مطابقة قاعدة البيانات) ⚡</h2>
    <div class="status-badge" id="status">⚡ البروكسي والخدمة بالخلفية جاهزة...</div>

    <div class="controls">
      <button class="btn" id="startBtn">🚀 بدء سحب الأرشيف الشامل (25 عامل)</button>
      <button class="btn stop" id="stopBtn" disabled>⛔ إيقاف</button>
    </div>
    <div class="controls">
      <button class="btn fix" id="fixBtn">🛠️ تعديل (حذف التكرار + إصلاح الناقص)</button>
    </div>

    <div class="grid-stats">
      <div class="stat-card"><h3 id="statManga">0</h3><p>أعمال جديدة</p></div>
      <div class="stat-card"><h3 id="statChaps">0</h3><p>فصول معالجة</p></div>
      <div class="stat-card"><h3 id="statImgs">0</h3><p>صور مرفوعة</p></div>
    </div>
    <div class="grid-stats">
      <div class="stat-card"><h3 id="statFailed">0</h3><p>فشل</p></div>
      <div class="stat-card"><h3 id="statDupes">0</h3><p>مكررات محذوفة</p></div>
      <div class="stat-card"><h3 id="statFixed">0</h3><p>أعمال تم إصلاحها</p></div>
    </div>
    <div class="grid-stats">
      <div class="stat-card"><h3 id="statNovels">0</h3><p>فصول روايات (نص)</p></div>
    </div>

    <div id="logBox">اضغط بدء لتشغيل الـ 25 عامل بالخلفية، أو "تعديل" لتنظيف قاعدة البيانات الحالية...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
      query, where, getDocs, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBkaDrsjial5W6xyXPPt1-trJhR7E9n2p4",
      authDomain: "pure-library-2d45d.firebaseapp.com",
      projectId: "pure-library-2d45d",
      storageBucket: "pure-library-2d45d.firebasestorage.app",
      messagingSenderId: "953898341477",
      appId: "1:953898341477:web:85409f5597f894ff13e28c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let mangaCount = 0, chapCount = 0, imgCount = 0, failCount = 0;
    let dupeCount = 0, fixedCount = 0, novelChapCount = 0;
    const processedUrls = new Set();
    const CONCURRENCY_LIMIT = 25; // 25 عامل موازي
    let RUNNING = false; // علامة الإيقاف (تشتغل للسحب وللتعديل)

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    function printLog(txt) {
      const b = document.getElementById('logBox');
      b.innerText += "\n> " + txt;
      b.scrollTop = b.scrollHeight;
    }

    function markFailed(reason) {
      failCount++;
      document.getElementById('statFailed').innerText = failCount;
      if (reason) printLog(`  ❌ [فشل]: ${reason}`);
    }

    function cleanUrl(url) {
      if (!url) return "";
      let cleaned = url.trim();
      if (cleaned.includes('androidplatform.net')) {
        cleaned = cleaned.replace(/https?:\/\/appassets\.androidplatform\.net/g, 'https://azorafly.com');
      }
      if (cleaned.startsWith("//")) return "https:" + cleaned;
      if (cleaned.startsWith("/")) return "https://azorafly.com" + cleaned;
      if (!cleaned.startsWith("http")) return "https://azorafly.com/" + cleaned;
      return cleaned;
    }

    function normalizeTitle(t) {
      if (!t) return "";
      return t.normalize('NFKC').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    // ============================================================
    // تنظيف اسم الفصل: يبقي رقم الفصل بس، يشيل أي كلمة زيادة
    // (تاريخ نشر، "جديد"، إلخ)
    // ============================================================
    function cleanChapterTitle(rawText, fallbackIndex) {
      const text = (rawText || '').trim();
      const m = text.match(/(?:الفصل|فصل|chapter|ch\.?)\s*(\d+(?:\.\d+)?)/i);
      if (m) return `الفصل ${m[1]}`;
      const numOnly = text.match(/^(\d+(?:\.\d+)?)/);
      if (numOnly) return `الفصل ${numOnly[1]}`;
      return `الفصل ${fallbackIndex}`;
    }

    // ============================================================
    // استخراج شامل: القصة، التقييم، كل التصنيفات بدون ترك وحد
    // ============================================================
    function extractDescription(mDoc) {
      const sel = '.summary__content, .description-summary .summary__content, div.manga-summary, #noticeContent p, .post-content_item .summary-content';
      const el = mDoc.querySelector(sel);
      return el ? el.textContent.trim() : '';
    }

    function extractRating(mDoc) {
      const sel = '.post-total-rating .score, .rating .score, span.total_votes, .score';
      const el = mDoc.querySelector(sel);
      if (!el) return null;
      const num = parseFloat(el.textContent.replace(',', '.').match(/[\d.]+/)?.[0]);
      return isNaN(num) ? el.textContent.trim() : num;
    }

    function extractGenres(mDoc) {
      const selectors = [
        '.genres-content a', '.summary-content .genres a', '.genres a',
        'a[href*="/genre/"]', 'a[href*="/genres/"]', '.tags-content a',
      ];
      const set = new Set();
      selectors.forEach(sel => {
        mDoc.querySelectorAll(sel).forEach(a => {
          const t = a.textContent.trim();
          if (t) set.add(t);
        });
      });
      return [...set];
    }

    // معالجة فصل وحد: يكتشف صور (مانهوا) أو نص (رواية) وياخذ المناسب
    async function extractChapterContent(chDoc) {
      const imgElements = Array.from(chDoc.querySelectorAll('img'));
      const rawImgs = imgElements
        .map(img => img.getAttribute('data-src') || img.getAttribute('lazy-src') || img.src)
        .filter(Boolean);
      const validImgs = [...new Set(rawImgs)]
        .map(cleanUrl)
        .filter(src => src && (src.includes('.jpg') || src.includes('.png') || src.includes('.webp') || src.includes('uploads')));

      if (validImgs.length > 0) {
        return { isNovel: false, images: validImgs, content: '' };
      }

      // ماكو صور — على الأغلب رواية نصية، نجمع النص من الحاويات المعروفة
      const textSelectors = [
        'div.text-right', 'div.entry-content p', 'div#novel-content',
        'div.reading-content p', '.text-left', '.chapter-content p', '#readerarea p',
      ];
      let paragraphs = [];
      for (const sel of textSelectors) {
        const found = chDoc.querySelectorAll(sel);
        if (found.length) {
          found.forEach(p => { const t = p.textContent.trim(); if (t) paragraphs.push(t); });
          if (paragraphs.length) break;
        }
      }
      const content = paragraphs.join('\n\n').trim();
      if (content.length > 50) return { isNovel: true, images: [], content };
      return { isNovel: false, images: [], content: '' };
    }

    // اتصال بالبروكسي المحلي المشتغل بالخلفية
    async function fetchViaProxy(targetUrl) {
      const safeUrl = cleanUrl(targetUrl);
      const proxyEndpoint = `http://127.0.0.1:8080/?url=${encodeURIComponent(safeUrl)}`;

      try {
        const res = await fetch(proxyEndpoint, { cache: "no-store" });
        if (res.ok) {
          const html = await res.text();
          if (html && html.length > 200 && !html.includes("Error fetching site")) {
            return new DOMParser().parseFromString(html, 'text/html');
          }
        }
      } catch (e) {}

      throw new Error("فشل الاتصال بالبروكسي بالخلفية.");
    }

    // معالجة عمل فردي - مع شرط التجاوز إذا كان موجود بقاعدة البيانات
    async function processSingleManga(mUrl) {
      if (processedUrls.has(mUrl)) return;
      processedUrls.add(mUrl);

      try {
        // 1. فحص قاعدة البيانات أولاً
        const q = query(collection(db, "manga"), where("sourceUrl", "==", mUrl));
        const snap = await getDocs(q);

        if (!snap.empty) {
          printLog(`  ⏭️ [متواجد بقاعدة البيانات - تم التجاوز]: ${mUrl}`);
          return; // الخروج المباشر وعدم إعادة سحبه أو رفعه
        }

        // 2. إذا غير موجود، البدء بجلب وتخزين العمل الجديد
        const mDoc = await fetchViaProxy(mUrl);
        const title = mDoc.querySelector('meta[property="og:title"]')?.content || mDoc.title || "عمل أزورا";
        const titleNorm = normalizeTitle(title);

        // فحص إضافي: نفس العنوان بالضبط بس برابط مختلف شوي (مع/بدون / بالنهاية مثلاً)
        const qTitle = query(collection(db, "manga"), where("titleNormalized", "==", titleNorm));
        const titleSnap = await getDocs(qTitle);
        if (!titleSnap.empty) {
          printLog(`  ⏭️ [نفس العنوان موجود برابط مختلف - تم التجاوز]: ${title}`);
          return;
        }

        const cover = cleanUrl(mDoc.querySelector('meta[property="og:image"]')?.content || "");
        const description = extractDescription(mDoc);
        const rating = extractRating(mDoc);
        const genres = extractGenres(mDoc);

        const docRef = await addDoc(collection(db, "manga"), {
          title: title,
          titleNormalized: titleNorm,
          cover: cover,
          coverUrl: cover,
          image: cover,
          description: description,
          rating: rating,
          genres: genres,
          sourceUrl: mUrl,
          sourceSite: "Azora",
          type: "مانهوا",
          status: "مستمر",
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        const mangaId = docRef.id;
        mangaCount++;
        document.getElementById('statManga').innerText = mangaCount;
        printLog(`  ✨ [رفع جديد]: ${title} — تصنيفات: ${genres.length}`);

        // 3. استخراج وفحص الفصول
        const chAnchors = Array.from(mDoc.querySelectorAll('a'))
          .map(a => ({ url: cleanUrl(a.href || a.getAttribute('href')), txt: a.innerText.trim() }))
          .filter(c => c.url && (c.url.includes('chapter') || c.url.includes('/ch-') || c.txt.includes('فصل')));

        const uniqueChaps = [];
        chAnchors.forEach(c => {
          if (!uniqueChaps.some(x => x.url === c.url)) uniqueChaps.push(c);
        });

        for (let j = 0; j < uniqueChaps.length; j++) {
          if (!RUNNING) break; // احترام زر الإيقاف
          const ch = uniqueChaps[j];
          const chapterTitle = cleanChapterTitle(ch.txt, j + 1);
          try {
            const chDoc = await fetchViaProxy(ch.url);
            const { isNovel, images, content } = await extractChapterContent(chDoc);

            if (images.length > 0 || content.length > 0) {
              await addDoc(collection(db, `manga/${mangaId}/chapters`), {
                title: chapterTitle,
                sourceUrl: ch.url,
                isNovel: isNovel,
                images: images,
                content: content,
                order: j + 1
              });

              chapCount++;
              if (isNovel) { novelChapCount++; document.getElementById('statNovels').innerText = novelChapCount; }
              imgCount += images.length;
              document.getElementById('statChaps').innerText = chapCount;
              document.getElementById('statImgs').innerText = imgCount;
            } else {
              markFailed(`فصل بدون محتوى: ${ch.url}`);
            }

          } catch (chErr) {
            markFailed(`فصل: ${ch.url}`);
          }
        }
      } catch (err) {
        markFailed(`عمل: ${mUrl}`);
      }
    }

    // توزيع 25 عامل بالتوازي
    async function processBatchInParallel(mangaUrls) {
      for (let i = 0; i < mangaUrls.length; i += CONCURRENCY_LIMIT) {
        if (!RUNNING) break; // احترام زر الإيقاف
        const batch = mangaUrls.slice(i, i + CONCURRENCY_LIMIT);
        printLog(`\n⚡ 25 عامل يفحصون ويرفعون (${batch.length}) عمل بالتوازي...`);
        await Promise.all(batch.map(url => processSingleManga(url)));
      }
    }

    // سحب صفحات الأرشيف الشامل فقط
    async function startArchiveScraping() {
      RUNNING = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('fixBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('status').innerText = "🚀 السحب بالخلفية قيد التشغيل (25 عامل)...";
      await requestWakeLock();

      printLog("📁 بدء مسح الأرشيف الشامل: https://azorafly.com/series/");

      let pageUrl = "https://azorafly.com/series/";
      const seenPages = new Set();
      let pageNum = 0;

      while (RUNNING && pageNum < 500) {
        pageNum++;
        if (!pageUrl || seenPages.has(pageUrl)) {
          printLog(`  🏁 اكتمل سحب كافة صفحات الأرشيف.`);
          break;
        }
        seenPages.add(pageUrl);

        try {
          const pDoc = await fetchViaProxy(pageUrl);
          const links = Array.from(pDoc.querySelectorAll('a'))
            .map(a => cleanUrl(a.href || a.getAttribute('href')))
            .filter(h => h && (h.includes('/series/') || h.includes('/manga/') || h.includes('/work/')) && !h.endsWith('/series/') && !h.includes('genres='));

          const mangaList = [...new Set(links)].filter(url => !processedUrls.has(url));

          if (mangaList.length === 0) {
            printLog(`  🏁 اكتمل سحب كافة صفحات الأرشيف عند الصفحة ${pageNum - 1}.`);
            break;
          }

          printLog(`  📑 الصفحة ${pageNum}: عثرنا على ${mangaList.length} عمل.`);
          await processBatchInParallel(mangaList);

          // يتبع رابط "الصفحة التالية" الفعلي من الموقع نفسه — بدون تخمين شكل الرابط
          const nextEl = pDoc.querySelector('a.next.page-numbers, .nav-previous a, a[rel="next"]');
          pageUrl = nextEl ? cleanUrl(nextEl.getAttribute('href') || nextEl.href) : null;

        } catch (pErr) {
          markFailed(`صفحة أرشيف رقم ${pageNum}`);
          printLog(`  ⚠️ إعادة المحاولة أو تخطي الصفحة ${pageNum}...`);
          break; // ما نكدر نعرف "الصفحة الجاية" لو فشلت هذي، نوقف بدل ما نلف بلا فايدة
        }
      }

      document.getElementById('status').innerText = RUNNING
        ? "🎉 اكتمل المسح والسحب الشامل بنجاح!"
        : "⛔ تم إيقاف السحب يدوياً.";
      RUNNING = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('fixBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    // ============================================================
    // زر "تعديل": يحذف التكرار، يبقي وحدة بس، ويصلح الناقص
    // ============================================================
    async function runFixSystem() {
      RUNNING = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('fixBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('status').innerText = "🛠️ التعديل شغال: حذف التكرار وإصلاح الناقص...";
      printLog("\n🛠️ بدء نظام التعديل...");

      const allSnap = await getDocs(collection(db, "manga"));
      const items = allSnap.docs.map(d => ({ id: d.id, data: d.data() }));
      printLog(`📄 وجدت ${items.length} عمل بقاعدة البيانات.`);

      const groups = new Map();
      for (const it of items) {
        const key = normalizeTitle(it.data.title) || normalizeTitle(it.data.sourceUrl);
        if (!key) continue;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(it);
      }

      const survivors = [];
      for (const [key, group] of groups) {
        if (!RUNNING) { printLog('  ⛔ تم الإيقاف أثناء فحص التكرار.'); break; }
        if (group.length === 1) { survivors.push(group[0]); continue; }

        printLog(`  🔍 "${group[0].data.title}" — ${group.length} نسخة مكررة، جاري الفحص...`);
        for (const it of group) {
          const chapsSnap = await getDocs(collection(db, `manga/${it.id}/chapters`));
          it.chapCount = chapsSnap.size;
        }
        group.sort((a, b) => b.chapCount - a.chapCount);
        const keep = group[0];
        const dupes = group.slice(1);

        for (const dupe of dupes) {
          const chapsSnap = await getDocs(collection(db, `manga/${dupe.id}/chapters`));
          for (const chDoc of chapsSnap.docs) {
            await deleteDoc(doc(db, `manga/${dupe.id}/chapters`, chDoc.id));
          }
          await deleteDoc(doc(db, "manga", dupe.id));
          dupeCount++;
          document.getElementById('statDupes').innerText = dupeCount;
          printLog(`    🗑️ حذف نسخة مكررة (${dupe.chapCount} فصل) — أبقيت النسخة صاحبة ${keep.chapCount} فصل`);
        }
        survivors.push(keep);
      }

      printLog(`✅ التكرار انتهى — أعمال متبقية: ${survivors.length}`);

      for (const it of survivors) {
        if (!RUNNING) { printLog('  ⛔ تم الإيقاف أثناء الإصلاح.'); break; }
        if (!it.data.sourceUrl) continue;

        const needsFix = !it.data.description || it.data.rating === undefined || it.data.rating === null ||
                          !it.data.genres || it.data.genres.length === 0 || !it.data.cover;

        let mDoc = null;
        const updates = {};

        try {
          if (needsFix) {
            mDoc = await fetchViaProxy(it.data.sourceUrl);
            if (!it.data.description) updates.description = extractDescription(mDoc);
            if (it.data.rating === undefined || it.data.rating === null) updates.rating = extractRating(mDoc);
            if (!it.data.genres || it.data.genres.length === 0) updates.genres = extractGenres(mDoc);
            if (!it.data.cover) {
              const cov = cleanUrl(mDoc.querySelector('meta[property="og:image"]')?.content || "");
              if (cov) { updates.cover = cov; updates.coverUrl = cov; updates.image = cov; }
            }
            if (!it.data.titleNormalized) updates.titleNormalized = normalizeTitle(it.data.title);
          }

          const chapsSnap = await getDocs(collection(db, `manga/${it.id}/chapters`));
          const existingUrls = new Set();
          let titlesFixed = 0;

          for (const chDoc of chapsSnap.docs) {
            const chData = chDoc.data();
            existingUrls.add(chData.sourceUrl);
            const cleaned = cleanChapterTitle(chData.title, chData.order || 1);
            if (cleaned !== chData.title) {
              await updateDoc(doc(db, `manga/${it.id}/chapters`, chDoc.id), { title: cleaned });
              titlesFixed++;
            }
          }
          if (titlesFixed > 0) printLog(`    🔤 صلّحت ${titlesFixed} عنوان فصل بـ "${it.data.title}"`);

          if (!mDoc) mDoc = await fetchViaProxy(it.data.sourceUrl);
          const chAnchors = Array.from(mDoc.querySelectorAll('a'))
            .map(a => ({ url: cleanUrl(a.href || a.getAttribute('href')), txt: a.innerText.trim() }))
            .filter(c => c.url && (c.url.includes('chapter') || c.url.includes('/ch-') || c.txt.includes('فصل')));
          const uniqueChaps = [];
          chAnchors.forEach(c => { if (!uniqueChaps.some(x => x.url === c.url)) uniqueChaps.push(c); });

          const newChaps = uniqueChaps.filter(c => !existingUrls.has(c.url));
          for (let j = 0; j < newChaps.length; j++) {
            if (!RUNNING) break;
            const ch = newChaps[j];
            const chapterTitle = cleanChapterTitle(ch.txt, chapsSnap.size + j + 1);
            try {
              const chDocPage = await fetchViaProxy(ch.url);
              const { isNovel, images, content } = await extractChapterContent(chDocPage);
              if (images.length > 0 || content.length > 0) {
                await addDoc(collection(db, `manga/${it.id}/chapters`), {
                  title: chapterTitle,
                  sourceUrl: ch.url,
                  isNovel, images, content,
                  order: chapsSnap.size + j + 1
                });
                chapCount++;
                if (isNovel) { novelChapCount++; document.getElementById('statNovels').innerText = novelChapCount; }
                document.getElementById('statChaps').innerText = chapCount;
              }
            } catch (e) { markFailed(`فصل جديد أثناء التعديل: ${ch.url}`); }
          }
          if (newChaps.length > 0) printLog(`    ➕ أضفت ${newChaps.length} فصل جديد لـ "${it.data.title}"`);

          if (Object.keys(updates).length > 0) {
            updates.updatedAt = serverTimestamp();
            await updateDoc(doc(db, "manga", it.id), updates);
            fixedCount++;
            document.getElementById('statFixed').innerText = fixedCount;
            printLog(`  ✅ أصلحت "${it.data.title}" (${Object.keys(updates).length} حقل)`);
          }
        } catch (e) {
          markFailed(`إصلاح "${it.data.title}"`);
        }
      }

      document.getElementById('status').innerText = RUNNING
        ? `🎉 التعديل خلص — حذف ${dupeCount} مكرر، أصلح ${fixedCount} عمل.`
        : "⛔ تم إيقاف التعديل يدوياً.";
      printLog(`\n🎉 التعديل خلص.`);
      RUNNING = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('fixBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function stopCurrentProcess() {
      RUNNING = false;
      document.getElementById('status').innerText = "⏳ جاري الإيقاف... (يخلص الشغل الحالي أول)";
      document.getElementById('stopBtn').disabled = true;
    }

    document.getElementById('startBtn').addEventListener('click', startArchiveScraping);
    document.getElementById('stopBtn').addEventListener('click', stopCurrentProcess);
    document.getElementById('fixBtn').addEventListener('click', () => {
      runFixSystem().catch(e => {
        printLog(`❌ خطأ عام بنظام التعديل: ${e.message}`);
        document.getElementById('startBtn').disabled = false;
        document.getElementById('fixBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
      });
    });
  </script>
</body>
</html>

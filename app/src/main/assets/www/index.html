
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تطبيق مانهوا ازورا — سحب ومزامنة</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e8ec;
    --muted:#8a8f9a; --accent:#4f8cff; --ok:#3ecf8e; --err:#ff5d5d; --warn:#f5a524;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:20px;
  }
  h1{font-size:18px; margin:0 0 4px}
  p.sub{color:var(--muted); margin:0 0 20px; font-size:13px}
  .panel{
    background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:16px; margin-bottom:14px;
  }
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
  input{
    width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border);
    background:#0d0f14; color:var(--text); font-size:13px; margin-bottom:10px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row > div{flex:1; min-width:160px}
  button{
    background:var(--accent); color:#fff; border:none; padding:10px 18px;
    border-radius:6px; font-size:13px; cursor:pointer; margin:4px 6px 4px 0;
  }
  button:disabled{opacity:.5; cursor:not-allowed}
  button.secondary{background:#2a2f3a}
  details{margin-top:6px}
  summary{color:var(--muted); font-size:12px; cursor:pointer; margin-bottom:8px}
  .stats{display:flex; gap:12px; flex-wrap:wrap; margin:12px 0}
  .stat{background:#0d0f14; border:1px solid var(--border); border-radius:8px; padding:10px 14px; min-width:100px}
  .stat b{display:block; font-size:20px}
  .stat span{color:var(--muted); font-size:11px}
  #log{
    height:300px; overflow-y:auto; background:#0d0f14; border:1px solid var(--border);
    border-radius:8px; padding:10px; font-size:12px; font-family:monospace; line-height:1.7;
  }
  .ok{color:var(--ok)} .err{color:var(--err)} .muted{color:var(--muted)} .warn{color:var(--warn)}
</style>
</head>
<body>

<h1>📚 تطبيق مانهوا ازورا</h1>
<p class="sub">سحب كامل (اسم، غلاف، تقييم، قصة، تصنيفات، فصول وصفحات) + مزامنة بدون تكرار + إصلاح الناقص تلقائياً — ملف واحد فقط، بدون سيرفر منفصل.</p>

<div class="panel">
  <div class="row">
    <div>
      <label>Firebase Web API Key (من Project Settings — ليس الملف الخاص)</label>
      <input id="apiKey" placeholder="AIzaSy...">
    </div>
    <div>
      <label>Project ID</label>
      <input id="projectId" value="pure-library-2d45d">
    </div>
  </div>
  <div class="row">
    <div>
      <label>رابط أرشيف السلاسل</label>
      <input id="seriesUrl" value="https://azorafly.com/series/">
    </div>
    <div>
      <label>عدد الكائنات (Workers)</label>
      <input id="workerCount" value="616" type="number">
    </div>
  </div>
  <div class="row">
    <div>
      <label>أقصى صفحات أرشيف</label>
      <input id="maxPages" value="50" type="number">
    </div>
    <div>
      <label>اسم المجموعة بقاعدة البيانات</label>
      <input id="collectionName" value="مانغا">
    </div>
  </div>

  <details>
    <summary>⚙️ إعدادات متقدمة (اختياري — اتركها فاضية إذا مو متأكد)</summary>
    <label>رابط بروكسي خاص بيك (proxy.py مستضاف على سيرفر) — إذا فاضي، التطبيق يجرب طرق مجانية بديلة تلقائياً</label>
    <input id="customProxy" placeholder="مثال: https://myproxy.onrender.com/fetch">
  </details>

  <div style="margin-top:10px">
    <button id="startBtn" onclick="startRun()">🚀 ابدأ السحب والمزامنة</button>
    <button class="secondary" onclick="purgeDuplicates()">🧹 حذف التكرار</button>
    <button class="secondary" onclick="stopRun()">⛔ إيقاف</button>
    <button class="secondary" onclick="testFetch()">🔌 اختبار الوصول للموقع</button>
  </div>
</div>

<div class="stats">
  <div class="stat"><b id="stNew">0</b><span>مانهوا جديدة</span></div>
  <div class="stat"><b id="stRepaired">0</b><span>تم إصلاحها</span></div>
  <div class="stat"><b id="stComplete">0</b><span>مكتملة مسبقاً</span></div>
  <div class="stat"><b id="stChapters">0</b><span>فصل تمت مزامنته</span></div>
  <div class="stat"><b id="stFailed">0</b><span>فشل</span></div>
  <div class="stat"><b id="stActive">0</b><span>كائن نشط الآن</span></div>
</div>

<div class="panel">
  <div id="log"></div>
</div>

<script>
// ============================================================
// حالة عامة
// ============================================================
let RUNNING = false;
let idToken = null;
let existingTitleIndex = new Map(); // normalized title -> {id, data}

const inProgress = new Set();
const queue = [];
const stats = { new: 0, repaired: 0, complete: 0, chapters: 0, failed: 0, active: 0 };

// selectors تخص تصميم موقع azorafly.com — عدّلها إذا اختلف شكل الصفحات
const SEL = {
  listingCard: 'div.page-item-detail',
  listingLink: 'h3.h5 a, .post-title a',
  nextPage: 'a.next.page-numbers, .nav-previous a',
  title: 'h1.entry-title, div.post-title h1',
  score: '.score, .rating .score, span.total_votes',
  cover: 'div.summary_image img, div.thumb img',
  description: '.summary__content, .description-summary .summary__content',
  genres: '.genres-content a, .summary-content .genres a',
  status: '.summary-content .post-status .summary-content, .post-status div.summary-content',
  chapterRow: 'li.wp-manga-chapter a, ul.main.version-chap li a',
  pageImage: 'div.reader-area img, div#readerarea img, div.page-break img',
};

// ============================================================
// جلب صفحات بدون سيرفر خاص — بروكسي مخصص إذا موجود، وإلا خدمات مجانية
// ============================================================
const PUBLIC_RELAYS = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${u}`,
];

async function fetchTarget(targetUrl, retries = 2) {
  const customProxy = document.getElementById('customProxy').value.trim();
  const attempts = customProxy
    ? [() => `${customProxy}?url=${encodeURIComponent(targetUrl)}`]
    : PUBLIC_RELAYS;

  for (let round = 0; round < retries; round++) {
    for (const buildUrl of attempts) {
      try {
        const res = await fetch(buildUrl(targetUrl), { headers: { 'Accept': 'text/html' } });
        if (res.ok) {
          const text = await res.text();
          // لو رجعت صفحة تحقق Cloudflare بدل المحتوى الحقيقي
          if (text.includes('Just a moment') || text.includes('cf-browser-verification')) {
            log(`⚠️ الموقع رجّع صفحة تحقق Cloudflare بدل المحتوى — هذا يحتاج سيرفر بروكسي حقيقي (راجع الشرح فوق).`, 'warn');
            return null;
          }
          if (text.length > 200) return text;
        }
      } catch (e) { /* جرب الطريقة الجاية */ }
    }
    await new Promise(r => setTimeout(r, 1200));
  }
  return null;
}

async function testFetch() {
  log('🔌 يفحص الوصول لـ azorafly.com...');
  const html = await fetchTarget(document.getElementById('seriesUrl').value.trim());
  if (html) {
    log(`✅ نجح! وصل محتوى الصفحة (${html.length} حرف).`, 'ok');
  } else {
    log('❌ فشل الوصول — إما الموقع محمي بـ Cloudflare قوي، أو الخدمات المجانية محظورة مؤقتاً. جرب لاحقاً أو استخدم بروكسي خاص بحقل الإعدادات المتقدمة.', 'err');
  }
}

function parseHTML(html) {
  return new DOMParser().parseFromString(html, 'text/html');
}

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  const t = new Date().toLocaleTimeString('ar-IQ');
  line.textContent = `[${t}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function renderStats() {
  document.getElementById('stNew').textContent = stats.new;
  document.getElementById('stRepaired').textContent = stats.repaired;
  document.getElementById('stComplete').textContent = stats.complete;
  document.getElementById('stChapters').textContent = stats.chapters;
  document.getElementById('stFailed').textContent = stats.failed;
  document.getElementById('stActive').textContent = stats.active;
}

// ============================================================
// أدوات نصية
// ============================================================
function safeDocId(text) {
  if (!text) return 'manga_doc';
  let s = text.normalize('NFKC').trim().toLowerCase();
  s = s.replace(/[^\w\u0600-\u06FF]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
  return (s || 'manga_doc').slice(0, 150);
}
function normalizeText(t) {
  if (!t) return '';
  return String(t).normalize('NFKC').trim().toLowerCase().replace(/\s+/g, ' ');
}
function encodeFsPath(path) {
  return path.split('/').map(encodeURIComponent).join('/');
}

// ============================================================
// Firebase Auth (مجهول) + Firestore REST
// ============================================================
async function ensureAuth() {
  if (idToken) return idToken;
  const apiKey = document.getElementById('apiKey').value.trim();
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ returnSecureToken: true }),
  });
  if (!res.ok) throw new Error('فشل تسجيل الدخول المجهول — تأكد من تفعيل Anonymous Auth و apiKey صحيح');
  const data = await res.json();
  idToken = data.idToken;
  return idToken;
}

function toFirestoreValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFirestoreValue) } };
  return { stringValue: String(v) };
}
function toFirestoreFields(obj) {
  const fields = {};
  for (const [k, val] of Object.entries(obj)) fields[k] = toFirestoreValue(val);
  return { fields };
}
function fieldsToObj(doc) {
  const out = {};
  const fields = (doc && doc.fields) || {};
  for (const [k, v] of Object.entries(fields)) {
    if ('stringValue' in v) out[k] = v.stringValue;
    else if ('integerValue' in v) out[k] = parseInt(v.integerValue, 10);
    else if ('doubleValue' in v) out[k] = v.doubleValue;
    else if ('booleanValue' in v) out[k] = v.booleanValue;
    else if ('arrayValue' in v) out[k] = (v.arrayValue.values || []).map(x => x.stringValue ?? x.integerValue ?? '');
  }
  return out;
}

async function firestoreWrite(path, obj) {
  const projectId = document.getElementById('projectId').value.trim();
  const token = await ensureAuth();
  const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${encodeFsPath(path)}?updateMask.fieldPaths=` +
              Object.keys(obj).map(encodeURIComponent).join('&updateMask.fieldPaths=');
  const res = await fetch(url, {
    method: 'PATCH',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(toFirestoreFields(obj)),
  });
  if (!res.ok) throw new Error(`Firestore write failed (${res.status}): ${await res.text()}`);
  return res.json();
}

async function firestoreListCollection(name) {
  const projectId = document.getElementById('projectId').value.trim();
  const token = await ensureAuth();
  let docs = [];
  let pageToken = null;
  do {
    const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${encodeFsPath(name)}` +
                `?pageSize=300${pageToken ? '&pageToken=' + pageToken : ''}`;
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
    if (!res.ok) throw new Error(`Firestore list failed (${res.status})`);
    const data = await res.json();
    docs = docs.concat(data.documents || []);
    pageToken = data.nextPageToken || null;
  } while (pageToken);
  return docs;
}

async function firestoreDelete(path) {
  const projectId = document.getElementById('projectId').value.trim();
  const token = await ensureAuth();
  const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${encodeFsPath(path)}`;
  await fetch(url, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
}

// ============================================================
// بناء فهرس العناوين الموجودة بقاعدة البيانات (مرة وحدة بأول تشغيل)
// حتى نلكم السلاسل القديمة اللي عندها IDs عشوائية، مو بس الجديدة
// ============================================================
async function buildTitleIndex() {
  const collectionName = document.getElementById('collectionName').value.trim();
  log('📇 يبني فهرس العناوين الموجودة بقاعدة البيانات...');
  let docs = [];
  try {
    docs = await firestoreListCollection(collectionName);
  } catch (e) {
    log(`⚠️ ما كدرت أقرا المجموعة (ربما فاضية لسه): ${e.message}`, 'warn');
  }
  existingTitleIndex.clear();
  for (const d of docs) {
    const id = d.name.split('/').pop();
    const data = fieldsToObj(d);
    const key = normalizeText(data['عنوان']);
    if (key) existingTitleIndex.set(key, { id, data });
  }
  log(`📇 الفهرس جاهز: ${existingTitleIndex.size} مانهوا موجودة مسبقاً.`);
}

// ============================================================
// اكتشاف روابط السلاسل عبر الصفحات (pagination)
// ============================================================
async function discoverSeriesLinks() {
  const startUrl = document.getElementById('seriesUrl').value.trim();
  const maxPages = parseInt(document.getElementById('maxPages').value, 10) || 50;
  const links = new Set();
  let url = startUrl;
  const seenPages = new Set();

  for (let i = 0; i < maxPages && RUNNING; i++) {
    if (!url || seenPages.has(url)) break;
    seenPages.add(url);

    const html = await fetchTarget(url);
    if (!html) { log(`فشل جلب صفحة الأرشيف: ${url}`, 'err'); break; }

    const doc = parseHTML(html);
    doc.querySelectorAll(SEL.listingCard).forEach(card => {
      const a = card.querySelector(SEL.listingLink);
      if (a && a.href) links.add(a.href);
    });

    log(`📄 صفحة ${i + 1}: ${links.size} رابط تراكمي`);
    const nextEl = doc.querySelector(SEL.nextPage);
    url = nextEl ? nextEl.href : null;
  }
  return [...links];
}

// ============================================================
// سحب مانهوا وحدة + كل فصولها وصفحاتها
// ============================================================
async function scrapeSeries(url) {
  const html = await fetchTarget(url);
  if (!html) return null;

  const doc = parseHTML(html);
  const titleEl = doc.querySelector(SEL.title);
  if (!titleEl) return null;

  const title = titleEl.textContent.trim();
  const scoreEl = doc.querySelector(SEL.score);
  const coverEl = doc.querySelector(SEL.cover);
  const descEl = doc.querySelector(SEL.description);
  const genreEls = [...doc.querySelectorAll(SEL.genres)];
  const chapterRows = [...doc.querySelectorAll(SEL.chapterRow)];

  const series = {
    title,
    source_url: url,
    cover: coverEl ? (coverEl.getAttribute('data-src') || coverEl.src || '') : '',
    score: scoreEl ? scoreEl.textContent.trim() : '',
    description: descEl ? descEl.textContent.trim() : '',
    genres: genreEls.map(g => g.textContent.trim()).filter(Boolean),
    chapters: [],
  };

  for (const row of chapterRows) {
    const chTitle = row.textContent.trim() || 'Untitled';
    const chUrl = row.href;
    if (!chUrl) continue;
    const pages = await scrapeChapterPages(chUrl);
    series.chapters.push({ title: chTitle, url: chUrl, pages });
  }

  return series;
}

async function scrapeChapterPages(chapterUrl) {
  const html = await fetchTarget(chapterUrl);
  if (!html) return [];
  const doc = parseHTML(html);
  const pages = [];
  doc.querySelectorAll(SEL.pageImage).forEach(img => {
    const src = img.getAttribute('data-src') || img.getAttribute('src');
    if (src && src.trim()) pages.push(src.trim());
  });
  return pages;
}

// ============================================================
// رفع لـ Firestore مع نظام تحقق وإصلاح (verify & repair)
// ============================================================
async function upsertSeries(series) {
  const collectionName = document.getElementById('collectionName').value.trim();
  const key = normalizeText(series.title);
  const existing = existingTitleIndex.get(key);

  const docId = existing ? existing.id : safeDocId(series.title);
  const docPath = `${collectionName}/${docId}`;

  const desiredFields = {
    'عنوان': series.title,
    'غطاء': series.cover,
    'قصة': series.description,
    'تقييم': series.score,
    'تصنيفات': series.genres,
    'المصدر URL': series.source_url,
    'موقع المصدر': 'أزورا',
    'يكتب': 'مانهوا',
    'عدد_الفصول': series.chapters.length,
  };

  let changedFields = {};
  if (existing) {
    for (const [k, v] of Object.entries(desiredFields)) {
      const current = existing.data[k];
      const isEmpty = current === undefined || current === null || current === '' ||
                      (Array.isArray(current) && current.length === 0);
      if (isEmpty && (Array.isArray(v) ? v.length > 0 : !!v)) {
        changedFields[k] = v; // يملأ فراغ ناقص
      } else if (k === 'عدد_الفصول' && current !== v) {
        changedFields[k] = v; // يصحح عدد الفصول لو تغيّر
      }
    }
  } else {
    changedFields = desiredFields;
  }

  if (existing && Object.keys(changedFields).length === 0) {
    stats.complete++;
    log(`✅ مكتملة مسبقاً: ${series.title}`, 'muted');
    renderStats();
    return;
  }

  changedFields['تم_التحديث'] = new Date().toISOString();
  await firestoreWrite(docPath, changedFields);

  // مزامنة الفصول (upsert لكل فصل — ما يكرر الموجود)
  for (const ch of series.chapters) {
    const chId = safeDocId(ch.title) || safeDocId(ch.url);
    await firestoreWrite(`${docPath}/الفصول/${chId}`, {
      'العنوان': ch.title,
      'الرابط': ch.url,
      'الصفحات': ch.pages,
      'عدد_الصفحات': ch.pages.length,
    });
    stats.chapters++;
  }

  if (existing) {
    stats.repaired++;
    log(`🔧 أصلحت: ${series.title} (${Object.keys(changedFields).length - 1} حقل)`, 'warn');
  } else {
    stats.new++;
    log(`✅ جديدة: ${series.title} — ${series.chapters.length} فصل`, 'ok');
    existingTitleIndex.set(key, { id: docId, data: desiredFields });
  }
  renderStats();
}

// ============================================================
// نظام الكائنات (Workers) + القفل
// ============================================================
function claim(url) {
  if (inProgress.has(url)) return false;
  inProgress.add(url);
  return true;
}
function release(url) { inProgress.delete(url); }

async function workerLoop(id) {
  while (RUNNING) {
    const url = queue.shift();
    if (!url) { if (!queue.length) break; await new Promise(r => setTimeout(r, 300)); continue; }
    if (!claim(url)) continue;

    stats.active++;
    renderStats();
    try {
      const series = await scrapeSeries(url);
      if (series) {
        await upsertSeries(series);
      } else {
        stats.failed++;
        log(`❌ تعذر تحليل: ${url}`, 'err');
      }
    } catch (e) {
      stats.failed++;
      log(`❌ خطأ بكائن ${id}: ${e.message}`, 'err');
    } finally {
      release(url);
      stats.active--;
      renderStats();
    }
  }
}

async function startRun() {
  if (RUNNING) return;
  if (!document.getElementById('apiKey').value.trim()) {
    log('❌ لازم تحط Firebase Web API Key أول.', 'err');
    return;
  }
  RUNNING = true;
  document.getElementById('startBtn').disabled = true;

  try {
    await buildTitleIndex();
  } catch (e) {
    log(`❌ فشل الاتصال بقاعدة البيانات: ${e.message}`, 'err');
    RUNNING = false;
    document.getElementById('startBtn').disabled = false;
    return;
  }

  log('🚀 بدء الاكتشاف...');
  const links = await discoverSeriesLinks();
  log(`📚 مجموع الروابط المكتشفة: ${links.length}`);

  if (links.length === 0) {
    log('⚠️ ما وصلنا لأي رابط — جرب زر "اختبار الوصول للموقع" فوق لتعرف السبب.', 'warn');
    RUNN
